name: Walidacja

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Walidacja HACS i hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Walidacja HACS
        uses: hacs/action@main
        with:
          category: integration
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ignore: brands

      - name: Walidacja hassfest
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Testy regresji
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Przygotowanie Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalacja zależności testowych
        run: python -m pip install pytest pytest-asyncio

      - name: Uruchomienie testów
        run: python -m pytest -q

  homeassistant:
    name: Wczytywanie na Home Assistant 2026.4.3
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Przygotowanie Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalacja Home Assistanta
        run: python -m pip install homeassistant==2026.4.3

      - name: Wczytanie platform i budowa formularzy konfiguracji
        run: |
          python - <<'PY'
          from importlib import import_module
          from importlib.metadata import version

          for name in ("config_flow", "sensor", "number", "climate", "select", "switch"):
              import_module(f"custom_components.lokalterm.{name}")

          from custom_components.lokalterm.config_flow import (
              _build_options_schema,
              _build_user_schema,
          )

          _build_user_schema()
          _build_options_schema({})
          print(f"Poprawnie wczytano platformy i formularze na HA {version('homeassistant')}.")
          PY